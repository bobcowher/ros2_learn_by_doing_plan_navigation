amcl:
  ros__parameters:
    use_sim_time: False  # CRITICAL FIX
    
    # Motion model - increase noise to account for real wheel slip
    alpha1: 0.2          # Increased from 0.05
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2          # Increased from 0.05
    
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # Particle filter
    min_particles: 500
    max_particles: 5000  # Increased from 2000 for better tracking
    pf_err: 0.05
    pf_z: 0.99
    
    # Recovery - ENABLE THIS
    recovery_alpha_slow: 0.001  # Was 0.0 - now adds particles when lost
    recovery_alpha_fast: 0.1    # Was 0.0
    
    # Update frequency - more aggressive
    update_min_d: 0.1    # Was 0.25 - update every 10cm
    update_min_a: 0.1    # Was 0.2 - update every ~6 degrees
    resample_interval: 1
    
    # Laser model
    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_max_range: 12.0       # Match your LIDAR range, was 100.0
    laser_min_range: 0.15       # Was -1.0
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    
    # Beam skip
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    
    lambda_short: 0.1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.5  # Reduced from 1.0
    scan_topic: scan
    
    # Initial pose
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
