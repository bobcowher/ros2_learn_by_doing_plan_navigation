controller_server:
  ros__parameters:
    use_sim_time: false 
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15  # Tighter tolerance
      yaw_goal_tolerance: 0.25
      stateful: True
    
    # RPP parameters - tuned for safety
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2  # REDUCED from 0.3 - slower is safer
      lookahead_dist: 0.4  # REDUCED from 0.6 - react faster
      min_lookahead_dist: 0.2  # REDUCED from 0.3
      max_lookahead_dist: 0.6  # REDUCED from 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0  # REDUCED from 1.8
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6  # REDUCED from 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true  # ENABLED - slow near obstacles
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1  # REDUCED from 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6  # REDUCED from 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0  # REDUCED from 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.6  # INCREASED from 0.3 - consider costs farther out
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false 
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.12  # INCREASED from 0.1 - add safety margin
      transform_tolerance: 0.5  # ADDED - helps with TF timing
      plugins: ["obstacle_layer", "inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # INCREASED from 3.0 - stronger repulsion
        inflation_radius: 0.5  # INCREASED from 0.4 - wider safety buffer
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      
      always_send_full_costmap: True
